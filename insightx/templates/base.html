<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}INSIGHTX{% endblock %} — Smart Energy AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Syne:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <style>
    :root {
      --coral: #ff6044;
      --coral-light: #ff8066;
      --coral-dim: rgba(255,96,68,0.15);
      --coral-glow: rgba(255,96,68,0.4);
      --space: #121313;
      --space-2: #1a1b1b;
      --space-3: #202222;
      --space-4: #2a2c2c;
      --space-5: #343636;
      --white: #f0ede8;
      --white-dim: rgba(240,237,232,0.6);
      --white-faint: rgba(240,237,232,0.1);
      --font-head: 'Orbitron', monospace;
      --font-body: 'Syne', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--space);
      color: var(--white);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── NOISE TEXTURE OVERLAY ─── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
      opacity: 0.4;
    }

    /* ─── NAVBAR ─── */
    nav {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 1000;
      padding: 1.2rem 2.5rem;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(18,19,19,0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,96,68,0.2);
    }

    .nav-logo {
      font-family: var(--font-head);
      font-size: 1.3rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      color: var(--white);
      text-decoration: none;
      display: flex; align-items: center; gap: 0.6rem;
    }

    .nav-logo .logo-x {
      color: var(--coral);
      text-shadow: 0 0 20px var(--coral-glow);
    }

    .nav-logo .logo-dot {
      width: 6px; height: 6px;
      background: var(--coral);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--coral);
      animation: pulse 2s infinite;
    }

    .nav-links {
      display: flex; gap: 0.3rem; align-items: center;
      list-style: none;
    }

    .nav-links a {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--white-dim);
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      border: 1px solid transparent;
      transition: all 0.25s;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .nav-links a:hover, .nav-links a.active {
      color: var(--coral);
      border-color: var(--coral-dim);
      background: var(--coral-dim);
    }

    /* ─── MAIN CONTENT ─── */
    main {
      padding-top: 80px;
      min-height: 100vh;
    }

    /* ─── SCANLINE EFFECT ─── */
    .scanlines::after {
      content: '';
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.03) 2px,
        rgba(0,0,0,0.03) 4px
      );
      pointer-events: none;
    }

    /* ─── CARDS ─── */
    .card {
      background: var(--space-2);
      border: 1px solid var(--space-5);
      border-radius: 12px;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .card:hover {
      border-color: rgba(255,96,68,0.3);
      box-shadow: 0 0 30px rgba(255,96,68,0.08), inset 0 0 30px rgba(255,96,68,0.03);
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--coral), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .card:hover::before { opacity: 1; }

    /* ─── BUTTONS ─── */
    .btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.75rem 1.8rem;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.25s;
      text-decoration: none;
      border: none;
    }

    .btn-primary {
      background: var(--coral);
      color: var(--space);
      font-weight: 600;
      box-shadow: 0 0 20px rgba(255,96,68,0.3);
    }

    .btn-primary:hover {
      background: var(--coral-light);
      box-shadow: 0 0 35px rgba(255,96,68,0.5);
      transform: translateY(-1px);
    }

    .btn-outline {
      background: transparent;
      color: var(--coral);
      border: 1px solid var(--coral);
    }

    .btn-outline:hover {
      background: var(--coral-dim);
      box-shadow: 0 0 20px rgba(255,96,68,0.2);
    }

    .btn-ghost {
      background: var(--space-3);
      color: var(--white-dim);
      border: 1px solid var(--space-5);
    }

    .btn-ghost:hover {
      color: var(--white);
      border-color: var(--space-5);
      background: var(--space-4);
    }

    /* ─── FORM ELEMENTS ─── */
    .form-group { margin-bottom: 1.2rem; }
    
    .form-group label {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--coral);
      margin-bottom: 0.5rem;
    }

    .form-group input, .form-group select {
      width: 100%;
      background: var(--space-3);
      border: 1px solid var(--space-5);
      border-radius: 6px;
      padding: 0.75rem 1rem;
      color: var(--white);
      font-family: var(--font-mono);
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--coral);
      box-shadow: 0 0 0 3px rgba(255,96,68,0.1);
    }

    .form-group select option { background: var(--space-2); }

    /* ─── SECTION HEADER ─── */
    .section-label {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--coral);
      margin-bottom: 0.5rem;
      display: flex; align-items: center; gap: 0.75rem;
    }

    .section-label::before {
      content: '';
      display: inline-block;
      width: 20px; height: 1px;
      background: var(--coral);
    }

    /* ─── STAT CARD ─── */
    .stat-num {
      font-family: var(--font-head);
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--coral);
      text-shadow: 0 0 30px rgba(255,96,68,0.4);
      line-height: 1;
    }

    .stat-label {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--white-dim);
      margin-top: 0.4rem;
    }

    /* ─── GRID ─── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; }

    /* ─── ANIMATIONS ─── */
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.7); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes glitch {
      0%, 100% { clip-path: inset(0 0 100% 0); }
      10% { clip-path: inset(30% 0 50% 0); transform: translateX(-4px); }
      20% { clip-path: inset(60% 0 20% 0); transform: translateX(4px); }
      30% { clip-path: inset(10% 0 80% 0); transform: translateX(-2px); }
      40%, 90% { clip-path: inset(0 0 0 0); transform: translateX(0); }
    }

    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100vh); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }

    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes drawLine {
      from { stroke-dashoffset: 1000; }
      to { stroke-dashoffset: 0; }
    }

    .fade-up { animation: fadeUp 0.6s ease forwards; }
    .fade-up-1 { animation: fadeUp 0.6s 0.1s ease forwards; opacity: 0; }
    .fade-up-2 { animation: fadeUp 0.6s 0.2s ease forwards; opacity: 0; }
    .fade-up-3 { animation: fadeUp 0.6s 0.3s ease forwards; opacity: 0; }
    .fade-up-4 { animation: fadeUp 0.6s 0.4s ease forwards; opacity: 0; }

    /* ─── BADGE ─── */
    .badge {
      display: inline-block;
      padding: 0.25rem 0.65rem;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 500;
    }

    .badge-coral { background: var(--coral-dim); color: var(--coral); border: 1px solid rgba(255,96,68,0.3); }
    .badge-success { background: rgba(0,210,110,0.1); color: #00d26e; border: 1px solid rgba(0,210,110,0.3); }
    .badge-warn { background: rgba(255,195,0,0.1); color: #ffc300; border: 1px solid rgba(255,195,0,0.3); }

    /* ─── PROGRESS BAR ─── */
    .progress-bar-wrap {
      background: var(--space-4);
      border-radius: 100px;
      height: 6px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 100px;
      background: linear-gradient(90deg, var(--coral), var(--coral-light));
      box-shadow: 0 0 10px var(--coral-glow);
      transition: width 1s ease;
    }

    /* ─── TOAST ─── */
    #toast {
      position: fixed;
      bottom: 2rem; right: 2rem;
      background: var(--space-3);
      border: 1px solid var(--coral);
      border-radius: 8px;
      padding: 1rem 1.5rem;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--white);
      z-index: 9998;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s;
      max-width: 320px;
    }

    #toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* ─── PAGE TRANSITION ─── */
    .page-enter {
      animation: fadeUp 0.5s ease;
    }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 768px) {
      .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
      nav { padding: 1rem 1.2rem; }
      .nav-links { gap: 0.1rem; }
      .nav-links a { padding: 0.4rem 0.6rem; font-size: 0.65rem; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <nav>
    <a href="/" class="nav-logo">
      <div class="logo-dot"></div>
      INSIGHT<span class="logo-x">X</span>
    </a>
    <ul class="nav-links">
      <li><a href="/" {% if request.path == '/' %}class="active"{% endif %}>Home</a></li>
      <li><a href="/dashboard" {% if request.path == '/dashboard' %}class="active"{% endif %}>Dashboard</a></li>
      <li><a href="/predict" {% if request.path == '/predict' %}class="active"{% endif %}>Predict</a></li>
      <li><a href="/visualize" {% if request.path == '/visualize' %}class="active"{% endif %}>Visualize</a></li>
    </ul>
  </nav>

  <main class="page-enter">
    {% block content %}{% endblock %}
  </main>

  <div id="toast"></div>

  <script>
    function showToast(msg, type='info') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.borderColor = type === 'error' ? '#ff4466' : 'var(--coral)';
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    // Active nav detection
    document.querySelectorAll('.nav-links a').forEach(a => {
      if(a.getAttribute('href') === window.location.pathname) {
        a.classList.add('active');
      }
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
